# ═══════════════════════════════════════════════════════════════
# .github/workflows/deploy.yml
#
# GitHub Actions — Continuous Deployment Pipeline
#
# WHAT THIS DOES:
# Every time you push to the "main" branch:
#   1. Builds the C# API
#   2. Runs tests
#   3. Deploys API to Azure App Service
#   4. Deploys frontend to Azure Static Web Apps
#
# SETUP: Add these secrets in GitHub → Settings → Secrets:
#   AZURE_WEBAPP_PUBLISH_PROFILE  (from Azure Portal → App Service → Get publish profile)
#   AZURE_STATIC_WEB_APPS_API_TOKEN (from Azure Portal → Static Web Apps → Manage deployment token)
# ═══════════════════════════════════════════════════════════════
name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── JOB 1: Build & Deploy C# API ─────────────────────────────
  deploy-api:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet packages
      run: dotnet restore TechBlog/backend/TechBlog.Api.csproj

    - name: Build (Release mode)
      run: dotnet build TechBlog/backend/TechBlog.Api.csproj --configuration Release --no-restore

    - name: Run tests
      run: dotnet test TechBlog/backend/TechBlog.Api.csproj --no-restore --verbosity normal
      continue-on-error: true   # don't fail the pipeline if no tests yet

    - name: Publish (create deployment package)
      run: dotnet publish TechBlog/backend/TechBlog.Api.csproj -c Release -o ./publish

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'techblog-api-h0fdc9hkf5hmadg0'   # ← change to your App Service name
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish

  # ── JOB 2: Deploy Frontend ────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-api   # wait for API to deploy first

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Azure Static Web Apps
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: "upload"
        app_location: "TechBlog/frontend"        # folder containing index.html
        output_location: ""              # no build step needed (vanilla HTML/JS)
