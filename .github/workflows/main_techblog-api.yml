name: Build and deploy ASP.Net Core app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore TechBlog/backend/TechBlog.Api.csproj

      - name: Build
        run: dotnet build TechBlog/backend/TechBlog.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish TechBlog/backend/TechBlog.Api.csproj -c Release -o ./publish

      - name: Zip publish output
        run: |
          cd ./publish
          zip -r ../deploy.zip .
          cd ..
          ls -la deploy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AC8C52F06BB047F8ADAB46B1CD158A96 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_27AFF64725C443FD9BAE60EA39AB1A81 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B5A08A97A33E4568BD4BFC9E064FE544 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'techblog-api'
          slot-name: 'Production'
          package: deploy.zip
